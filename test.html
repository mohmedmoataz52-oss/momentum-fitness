<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="assets/css/backgrounds.aed14f2179ed.css">
<link rel="preconnect" href="https://xcgbxurbnsytecrdupct.supabase.co">

    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MoMentum - Sign In</title>

    <link rel="stylesheet"
        href="assets/vendor/fontawesome.fa52c790d103.css">

    <link rel="stylesheet" href="assets/css/test-1.39336a298884.css">
<link rel="stylesheet" href="assets/css/momentum-ui.179e81653248.css">
</head>


<body>

<div class="page">


    <!-- ================================
         LOGO
    ================================= -->

    <div class="logo">

        <i class="fa-solid fa-dumbbell"></i>

        <span class="white">MOMENT</span>
        <span class="green">UM</span>

    </div>


    <!-- ================================
         LEFT SIDE
    ================================= -->

    <div class="hero">

        <h2>
            Build Your
            <span>Strongest</span>
            Self.
        </h2>

        <p>
            Every workout is a step forward.
            Stay focused, stay consistent,
            and become stronger every day.
        </p>

    </div>


    <!-- ================================
         RIGHT LOGIN
    ================================= -->

    <div class="login-area">

        <h1>
            Welcome <span>Back.</span>
        </h1>

        <p class="subtitle">
            Sign in to continue your fitness journey
            and reach your goals.
        </p>


        <!-- ROLE -->

        <div class="role-title">
            Sign in as
        </div>

        <div class="roles">

            <button
                type="button"
                class="role-btn active"
                id="athleteBtn"
                onclick="selectRole('athlete')">

                <i class="fa-solid fa-person-running"></i>
                Athlete

            </button>


            <button
                type="button"
                class="role-btn"
                id="trainerBtn"
                onclick="selectRole('trainer')">

                <i class="fa-solid fa-user-tie"></i>
                Trainer

            </button>

        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                    autocomplete="email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="input-box password-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required>

                <i
                    class="fa-solid fa-eye eye"
                    id="passwordEye"
                    onclick="togglePassword()">
                </i>

            </div>


            <!-- OPTIONS -->

            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember">

                    Remember me

                </label>


                <span
                    id="forgotLink" role="button" tabindex="0" class="forgot"
                    onclick="forgotPassword()">

                    Forgot password?

                </span>

            </div>


            <!-- SIGN IN -->

            <button
                type="submit"
                class="login-btn">

                Sign In

            </button>

        </form>


        <!-- MESSAGE -->

        <div id="message"></div>


        <!-- CREATE ACCOUNT -->

        <div class="create-account">

            Don't have an account?

            <a
                id="createLink"
                href="test2.html">

                Create Account

            </a>

        </div>

    </div>

</div>


<script defer src="assets/vendor/supabase.bee24fc29228.js"></script>
<script defer src="assets/js/test-1.3b18a06a3c8f.js"></script>

</body>
</html>
