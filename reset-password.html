<head>

    <title>MOMENTUM — Reset Password</title>

        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background: #07131c;
        }


        /* ================================
           FULL SCREEN PAGE
        ================================= */

        .page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;

            background:
                linear-gradient(
                    90deg,
                    rgba(3, 13, 19, .08) 0%,
                    rgba(3, 13, 19, .08) 35%,
                    rgba(3, 13, 19, .30) 52%,
                    rgba(3, 13, 19, .82) 75%,
                    #07131c 100%
                ),
                url("https://static.vecteezy.com/system/resources/thumbnails/037/235/157/small_2x/ai-generated-gym-with-many-equipments-free-photo.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* ================================
           TOP LOGO
        ================================= */

        .logo {
            position: absolute;
            top: 34px;
            left: 55px;

            display: flex;
            align-items: center;

            z-index: 20;

            font-size: 30px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .logo i {
            color: #39d98a;
            font-size: 27px;
            margin-right: 10px;
        }

        .logo .white {
            color: #ffffff;
        }

        .logo .green {
            color: #39d98a;
        }


        /* ================================
           LEFT HERO
        ================================= */

        .hero {
            position: absolute;

            left: 55px;
            top: 50%;

            transform: translateY(-35%);

            width: 500px;

            z-index: 10;
        }

        .hero h2 {
            font-size: 54px;
            line-height: 1.05;

            font-weight: 800;

            margin-bottom: 22px;

            text-shadow:
                0 5px 25px rgba(0, 0, 0, .65);
        }

        .hero h2 span {
            color: #39d98a;
        }

        .hero p {
            width: 440px;

            color: #e3eaed;

            font-size: 17px;
            line-height: 1.7;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, .8);
        }


        /* ================================
           LOGIN AREA
        ================================= */

        .login-area {
            position: absolute;

            top: 50%;
            right: 7%;

            transform: translateY(-50%);

            width: 420px;

            z-index: 20;
        }


        /* ================================
           WELCOME
        ================================= */

        .login-area h1 {
            font-size: 46px;
            line-height: 1.1;

            margin-bottom: 10px;

            font-weight: 800;
        }

        .login-area h1 span {
            color: #39d98a;
        }

        .subtitle {
            color: #a5b1b7;

            font-size: 15px;
            line-height: 1.6;

            margin-bottom: 28px;
        }


        /* ================================
           ROLE
        ================================= */

        .role-title {
            color: #8f9ca3;

            font-size: 13px;

            margin-bottom: 9px;
        }

        .roles {
            display: flex;
            gap: 10px;

            margin-bottom: 20px;
        }

        .role-btn {
            flex: 1;

            height: 47px;

            border: 1px solid #3a505b;
            border-radius: 10px;

            background: rgba(7, 25, 34, .78);

            color: #b2bdc2;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition: .25s;
        }

        .role-btn i {
            margin-right: 7px;
        }

        .role-btn:hover {
            border-color: #39d98a;
            color: #ffffff;
        }

        .role-btn.active {
            background: #39d98a;
            border-color: #39d98a;

            color: #06151c;

            box-shadow:
                0 8px 25px rgba(57, 217, 138, .12);
        }


        /* ================================
           INPUTS
        ================================= */

        .input-box {
            position: relative;

            width: 100%;

            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            height: 55px;

            padding: 0 48px;

            border: 1px solid #354c57;
            border-radius: 10px;

            outline: none;

            background: rgba(7, 25, 34, .88);

            color: #ffffff;

            font-size: 15px;

            transition: .25s;
        }

        .input-box input::placeholder {
            color: #71818a;
        }

        .input-box input:focus {
            border-color: #39d98a;

            box-shadow:
                0 0 0 3px rgba(57, 217, 138, .08);
        }

        .input-box > i:first-child {
            position: absolute;

            left: 16px;
            top: 50%;

            transform: translateY(-50%);

            color: #39d98a;

            z-index: 2;
        }


        /* ================================
           PASSWORD EYE
        ================================= */

        .password-box input {
            padding-right: 52px;
        }

        .password-box .eye {
            position: absolute;

            left: auto !important;
            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            width: 21px;

            color: #71818a;

            cursor: pointer;

            text-align: center;

            z-index: 5;

            transition: .2s;
        }

        .password-box .eye:hover {
            color: #39d98a;
        }


        /* ================================
           OPTIONS
        ================================= */

        .options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin: 5px 0 22px;

            font-size: 13px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #8999a2;

            cursor: pointer;
        }

        .remember input {
            accent-color: #39d98a;

            cursor: pointer;
        }

        .forgot {
            color: #39d98a;

            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }


        /* ================================
           SIGN IN
        ================================= */

        .login-btn {
            width: 100%;
            height: 55px;

            border: none;
            border-radius: 10px;

            background: #39d98a;

            color: #06151c;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;

            transition: .25s;
        }

        .login-btn:hover {
            background: #51e99d;

            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(57, 217, 138, .22);
        }

        .login-btn:active {
            transform: translateY(0);
        }


        /* ================================
           MESSAGE
        ================================= */

        #message {
            min-height: 20px;

            margin-top: 15px;

            font-size: 14px;
        }


        /* ================================
           CREATE ACCOUNT
        ================================= */

        .create-account {
            margin-top: 19px;

            color: #8999a2;

            font-size: 14px;
        }

        .create-account a {
            color: #39d98a;

            text-decoration: none;

            font-weight: 700;
        }

        .create-account a:hover {
            text-decoration: underline;
        }


        /* ================================
           TABLET
        ================================= */

        @media (max-width: 1050px) {

            .login-area {
                right: 5%;
                width: 390px;
            }

            .hero {
                left: 40px;
                width: 400px;
            }

            .hero h2 {
                font-size: 43px;
            }

            .hero p {
                width: 370px;
                font-size: 15px;
            }

            .logo {
                left: 40px;
            }
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 750px) {

            body {
                overflow-y: auto;
            }

            .page {
                min-height: 100vh;

                background:
                    linear-gradient(
                        rgba(3, 13, 19, .72),
                        rgba(3, 13, 19, .94)
                    ),
                    url("gym.jpg");

                background-size: cover;
                background-position: center;
            }

            .logo {
                position: relative;

                top: auto;
                left: auto;

                padding: 28px 25px 0;

                font-size: 27px;
            }

            .logo i {
                font-size: 24px;
            }

            .hero {
                position: relative;

                top: auto;
                left: auto;

                transform: none;

                width: auto;

                margin: 70px 25px 45px;
            }

            .hero h2 {
                font-size: 40px;
            }

            .hero p {
                width: auto;

                font-size: 15px;
            }

            .login-area {
                position: relative;

                top: auto;
                right: auto;

                transform: none;

                width: auto;

                margin: 0 25px 50px;
            }

            .login-area h1 {
                font-size: 37px;
            }
        }


        @media (max-width: 420px) {

            .hero {
                margin-top: 55px;
            }

            .hero h2 {
                font-size: 34px;
            }

            .login-area h1 {
                font-size: 34px;
            }

            .role-btn {
                font-size: 13px;
            }
        }

    </style>

@media(max-width:640px){.athlist{grid-template-columns:minmax(0,1fr)!important;max-height:260px}.tab{min-height:40px}.history-card .exercise-name{display:flex;align-items:flex-start;flex-direction:column;gap:6px}}
#homeProgressCircle::before{content:attr(data-value)}
@media(max-width:1024px){body[data-momentum-page="test3.html"] .container>header>.brand{display:none}body[data-momentum-page="test3.html"] .user-area{width:100%;justify-content:space-between}.trainer-photo{flex:0 0 64px;width:64px;height:64px}.trainer-card-left,.trainer-info{min-width:0}.trainer-info{flex:1}.trainer-info h3{overflow-wrap:anywhere}.trainer-card-left{width:100%}}

</style>
</head>


<body>

<div class="page">


    <!-- ================================
         LOGO
    ================================= -->

    <div class="logo">

        <i class="fa-solid fa-dumbbell"></i>

        <span class="white">MOMENT</span>
        <span class="green">UM</span>

    </div>


    <!-- ================================
         LEFT SIDE
    ================================= -->

    <div class="hero">

        <h2>
            Build Your
            <span>Strongest</span>
            Self.
        </h2>

        <p>
            Every workout is a step forward.
            Stay focused, stay consistent,
            and become stronger every day.
        </p>

    </div>


    <!-- ================================
         RIGHT LOGIN
    ================================= -->

    <div class="login-area">

        <h1>
            Reset <span>Password.</span>
        </h1>

        <p class="subtitle">
            Choose a new password to continue your fitness journey.
        </p>


<form id="resetForm">
 <div class="input-box password-box"><i class="fa-solid fa-lock"></i><input id="password" type="password" autocomplete="new-password" placeholder="New password" minlength="8" required disabled><i id="passwordEye" class="fa-solid fa-eye eye" role="button" tabindex="0" aria-label="Show or hide passwords" onclick="togglePassword()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePassword();}"></i></div>
 <div class="input-box password-box"><i class="fa-solid fa-lock"></i><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm new password" minlength="8" required disabled></div>
 <button type="submit" class="login-btn" id="updatePassword" disabled>Update Password</button>
 </form><div id="message" role="status" aria-live="polite"></div><div class="create-account"><a href="test.html">Back to Sign In</a></div>
    </div>

</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);let sb=null,recoveryUser=null,busy=false,done=false,recoveryEvent=false;
const marker='momentumPasswordRecovery';
function message(text,ok=false){$('message').textContent=text;$('message').style.color=ok?'#39d98a':'#ff6b6b';}
function lock(v){$('password').disabled=v;$('confirmPassword').disabled=v;$('updatePassword').disabled=v;}
function eraseMarker(){try{sessionStorage.removeItem(marker);}catch(_){}}
function togglePassword(){const visible=$('password').type==='password';$('password').type=$('confirmPassword').type=visible?'text':'password';$('passwordEye').className='fa-solid '+(visible?'fa-eye-slash':'fa-eye')+' eye';}
async function init(){
 lock(true);message('Checking your recovery link...',true);
 try{
  const params=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
  if(params.has('error')||query.has('error')){history.replaceState(null,'',location.pathname);throw Error('This reset link is invalid or expired. Request a new link from Sign In.');}
  if(!window.supabase)throw Error('Supabase could not load. Reload this page.');
  sb=window.supabase.createClient('https://xcgbxurbnsytecrdupct.supabase.co','sb_publishable_PAd7gf0Q-N9H4PqgqqaVNg_EfE583xO',{auth:{flowType:'implicit'}});
  sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session?.user){recoveryEvent=true;}if(recoveryUser&&session?.user?.id!==recoveryUser){recoveryUser=null;eraseMarker();lock(true);if(!done)message('Your session changed. Open a fresh recovery link.');}});
  const session=await sb.auth.getSession();if(session.error)throw session.error;
  const {data,error}=await sb.auth.getUser();if(error||!data.user)throw Error('This reset link is invalid or expired. Request a new link from Sign In.');
  let stored=null;try{stored=JSON.parse(sessionStorage.getItem(marker)||'null');}catch(_){}
  if(!recoveryEvent&&!(stored?.id===data.user.id&&stored.until>Date.now()))throw Error('Open the reset link from your email to choose a new password.');
  recoveryUser=data.user.id;try{sessionStorage.setItem(marker,JSON.stringify({id:recoveryUser,until:Date.now()+1800000}));}catch(_){}
  history.replaceState(null,'',location.pathname);lock(false);message('Choose a new password of at least 8 characters.',true);
 }catch(e){eraseMarker();lock(true);message(e.message);}
}
$('resetForm').addEventListener('submit',async e=>{
 e.preventDefault();if(busy||done||!recoveryUser)return;
 const password=$('password').value;if(password.length<8){message('Use at least 8 characters.');return;}if(password!==$('confirmPassword').value){message('The passwords do not match.');return;}
 busy=true;lock(true);message('Updating your password...',true);
 try{
  const {data,error}=await sb.auth.getUser();if(error||data.user?.id!==recoveryUser)throw Error('Your session changed. Request a new recovery link.');
  const result=await sb.auth.updateUser({password});if(result.error)throw result.error;
  done=true;eraseMarker();$('resetForm').reset();message('Password updated. Return to Sign In and use your new password.',true);
  const signedOut=await sb.auth.signOut({scope:'local'});if(signedOut.error)message('Password updated. You can return to Sign In. Sign-out could not finish on this browser.',true);
 }catch(error){message(error.message||'Could not update the password. Try again.');}
 finally{busy=false;lock(done||!recoveryUser);}
});
init();

</script></body>
</html>
