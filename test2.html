<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="assets/css/backgrounds.aed14f2179ed.css">
<link rel="preconnect" href="https://xcgbxurbnsytecrdupct.supabase.co">


    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MoMentum | Create Account</title>

    <link rel="stylesheet"
        href="assets/vendor/fontawesome.fa52c790d103.css">

    <link rel="stylesheet" href="assets/css/test2-1.fb07180bf06e.css">

<link rel="stylesheet" href="assets/css/momentum-ui.179e81653248.css">
</head>


<body>


    <div class="container">


        <!-- =========================================
             IMAGE
        ========================================= -->

        <div class="image-side">

            <div class="image-content">


                <div class="logo">

                    <i class="fa-solid fa-dumbbell"></i>

                    <span class="white">MOMENT</span>
                    <span class="green">UM</span>

                </div>


                <h1>
                    START YOUR<br>
                    <span>JOURNEY.</span>
                </h1>


                <p>
                    Create your account and take the first
                    step toward a stronger and healthier you.
                </p>


            </div>

        </div>


        <!-- =========================================
             FORM
        ========================================= -->

        <div class="form-side">


            <h2>
                Create Account
            </h2>


            <p class="subtitle">
                Join MoMentum and start your fitness journey.
            </p>


            <!-- ROLE -->

            <div class="role-title">
                I am a
            </div>


            <div class="roles">


                <button
                    type="button"
                    class="role-btn active"
                    id="athleteBtn"
                    onclick="setRole('athlete')">

                    <i class="fa-solid fa-person-running"></i>

                    Athlete

                </button>


                <button
                    type="button"
                    class="role-btn"
                    id="trainerBtn"
                    onclick="setRole('trainer')">

                    <i class="fa-solid fa-user-tie"></i>

                    Trainer

                </button>


            </div>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- NAME -->

                <div class="input-group">

                    <label>
                        Full Name
                    </label>


                    <div class="input-box">

                        <i class="fa-solid fa-user left-icon"></i>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required>

                    </div>

                </div>


                <!-- AGE + PHONE -->

                <div class="row">


                    <div class="input-group">

                        <label>
                            Age
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-calendar left-icon"></i>

                            <input
                                type="number"
                                id="age"
                                placeholder="Age"
                                min="10"
                                max="100"
                                required>

                        </div>

                    </div>


                    <div class="input-group">

                        <label>
                            Phone
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-phone left-icon"></i>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="Phone"
                                required>

                        </div>

                    </div>


                </div>


                <!-- WEIGHT + HEIGHT -->

                <div class="row">


                    <div class="input-group">

                        <label>
                            Weight (kg)
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-weight-scale left-icon"></i>

                            <input
                                type="number"
                                id="weight"
                                placeholder="Weight"
                                min="1"
                                required>

                        </div>

                    </div>


                    <div class="input-group">

                        <label>
                            Height (cm)
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-ruler-vertical left-icon"></i>

                            <input
                                type="number"
                                id="height"
                                placeholder="Height"
                                min="1"
                                required>

                        </div>

                    </div>


                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label>
                        Email
                    </label>


                    <div class="input-box">

                        <i class="fa-solid fa-envelope left-icon"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>

                </div>


                <!-- PASSWORD + CONFIRM -->

                <div class="row">


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label>
                            Password
                        </label>


                        <div class="input-box password-box">

                            <i class="fa-solid fa-lock left-icon"></i>


                            <input
                                type="password"
                                id="password"
                                placeholder="Password"
                                minlength="8"
                                autocomplete="new-password"
                                required>


                            <i
                                class="fa-solid fa-eye eye"
                                onclick="togglePassword('password', this)">
                            </i>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="input-group">

                        <label>
                            Confirm Password
                        </label>


                        <div class="input-box password-box">

                            <i class="fa-solid fa-lock left-icon"></i>


                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm"
                                minlength="8"
                                autocomplete="new-password"
                                required>


                            <i
                                class="fa-solid fa-eye eye"
                                onclick="togglePassword('confirmPassword', this)">
                            </i>

                        </div>

                    </div>


                </div>


                <!-- CREATE -->

                <button
                    class="create-btn"
                    type="submit">

                    CREATE ACCOUNT

                </button>


                <div
                    class="message"
                    id="message">
                </div>


            </form>


            <!-- SIGN IN -->

            <div class="signin">

                Already have an account?

                <a
                    id="signinLink"
                    href="test.html?role=athlete">

                    Sign In

                </a>

            </div>


        </div>

    </div>


    <script defer src="assets/vendor/supabase.bee24fc29228.js"></script>
<script defer src="assets/js/test2-1.98215933d983.js"></script>

</body>

</html>
