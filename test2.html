<head>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #020b12;

            color: white;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 25px;
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {

            width: 100%;

            max-width: 1150px;

            min-height: 700px;

            display: grid;

            grid-template-columns: 0.95fr 1.05fr;

            background: #07131c;

            border: 1px solid #263744;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, .55);
        }


        /* =========================================
           IMAGE SIDE
        ========================================= */

        .image-side {

            position: relative;

            min-height: 700px;

            display: flex;

            align-items: flex-end;

            padding: 50px;

            background:

                linear-gradient(
                    180deg,
                    rgba(2, 11, 18, .08) 0%,
                    rgba(2, 11, 18, .18) 35%,
                    rgba(2, 11, 18, .88) 100%
                ),

                url("https://png.pngtree.com/background/20230528/original/pngtree-an-empty-gym-with-some-equipment-and-dark-walls-picture-image_2773763.jpg") center / cover no-repeat;
        }


        .image-content {

            width: 100%;

            max-width: 430px;
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {

            display: flex;

            align-items: center;

            margin-bottom: 20px;

            font-size: 27px;

            font-weight: 900;

            letter-spacing: 1px;
        }

        .logo i {

            color: #39d98a;

            font-size: 25px;

            margin-right: 10px;
        }

        .logo .white {
            color: #ffffff;
        }

        .logo .green {
            color: #39d98a;
        }


        /* =========================================
           IMAGE TEXT
        ========================================= */

        .image-content h1 {

            font-size: 48px;

            line-height: 1.03;

            font-weight: 800;

            margin-bottom: 17px;

            text-shadow:
                0 5px 25px rgba(0, 0, 0, .7);
        }


        .image-content h1 span {
            color: #39d98a;
        }


        .image-content p {

            max-width: 400px;

            color: #d3dde1;

            font-size: 15px;

            line-height: 1.7;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, .7);
        }


        /* =========================================
           FORM SIDE
        ========================================= */

        .form-side {

            padding: 48px 55px;

            overflow-y: auto;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .form-side h2 {

            font-size: 32px;

            line-height: 1.2;

            margin-bottom: 8px;

            font-weight: 800;
        }


        .subtitle {

            color: #8998a2;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        /* =========================================
           ROLE
        ========================================= */

        .role-title {

            color: #8998a2;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 9px;
        }


        .roles {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-bottom: 22px;
        }


        .role-btn {

            width: 100%;

            height: 46px;

            border-radius: 9px;

            border: 1px solid #304551;

            background: #0a1822;

            color: #aab6bd;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: .2s;
        }


        .role-btn i {

            margin-right: 7px;
        }


        .role-btn:hover {

            border-color: #39d98a;

            color: #39d98a;
        }


        .role-btn.active {

            color: #39d98a;

            border-color: #39d98a;

            background:
                rgba(57, 217, 138, .08);
        }


        /* =========================================
           ROWS
        ========================================= */

        .row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 13px;
        }


        /* =========================================
           INPUT GROUP
        ========================================= */

        .input-group {

            width: 100%;

            margin-bottom: 15px;
        }


        label {

            display: block;

            color: #b9c4ca;

            font-size: 12px;

            font-weight: 500;

            margin-bottom: 7px;
        }


        /* =========================================
           INPUT BOX
        ========================================= */

        .input-box {

            position: relative;

            width: 100%;

            height: 45px;
        }


        /* LEFT ICON */

        .input-box > .left-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            color: #687984;

            font-size: 14px;

            pointer-events: none;

            z-index: 2;
        }


        /* =========================================
           ALL INPUTS
        ========================================= */

        .input-box input {

            width: 100%;

            height: 45px;

            padding: 0 14px 0 42px;

            border-radius: 9px;

            border: 1px solid #263744;

            outline: none;

            background: #0a1822;

            color: white;

            font-size: 13px;

            transition: .2s;
        }


        .input-box input::placeholder {

            color: #657681;
        }


        .input-box input:focus {

            border-color: #39d98a;

            box-shadow:
                0 0 0 3px rgba(57, 217, 138, .07);
        }


        /* =========================================
           PASSWORD BOX
        ========================================= */

        .password-box {

            position: relative;

            width: 100%;
        }


        /*
           IMPORTANT:
           Password inputs have extra space
           on the right for the eye.
        */

        .password-box input {

            padding-left: 42px;

            padding-right: 48px;
        }


        /* =========================================
           PASSWORD EYE
        ========================================= */

        .password-box .eye {

            position: absolute;

            left: auto !important;

            right: 14px;

            top: 50%;

            width: 20px;

            height: 20px;

            margin: 0;

            padding: 0;

            transform: translateY(-50%);

            display: flex;

            align-items: center;

            justify-content: center;

            color: #687984;

            font-size: 14px;

            cursor: pointer;

            z-index: 10;

            transition: .2s;
        }


        .password-box .eye:hover {

            color: #39d98a;
        }


        /* =========================================
           CREATE BUTTON
        ========================================= */

        .create-btn {

            width: 100%;

            height: 49px;

            border: none;

            border-radius: 9px;

            background: #39d98a;

            color: #03110c;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: .3px;

            cursor: pointer;

            margin-top: 3px;

            transition: .2s;
        }


        .create-btn:hover {

            background: #51e99d;

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(57, 217, 138, .15);
        }


        .create-btn:active {

            transform: translateY(0);
        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {

            min-height: 20px;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;

            margin-top: 12px;
        }


        /* =========================================
           SIGN IN
        ========================================= */

        .signin {

            text-align: center;

            color: #8998a2;

            font-size: 13px;

            margin-top: 17px;
        }


        .signin a {

            color: #39d98a;

            text-decoration: none;

            font-weight: bold;
        }


        .signin a:hover {

            text-decoration: underline;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 950px) {

            body {
                padding: 15px;
            }


            .container {

                max-width: 800px;

                grid-template-columns: 1fr 1fr;
            }


            .image-side {

                padding: 35px;
            }


            .image-content h1 {

                font-size: 38px;
            }


            .form-side {

                padding: 35px 30px;
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 760px) {

            body {

                padding: 0;

                align-items: flex-start;
            }


            .container {

                width: 100%;

                min-height: 100vh;

                grid-template-columns: 1fr;

                border: none;

                border-radius: 0;

                box-shadow: none;
            }


            .image-side {

                min-height: 270px;

                padding: 35px 28px;

                align-items: flex-end;
            }


            .image-content h1 {

                font-size: 34px;
            }


            .image-content p {

                font-size: 13px;

                max-width: 350px;
            }


            .logo {

                font-size: 24px;
            }


            .form-side {

                padding: 35px 25px 45px;

                overflow: visible;
            }


            .form-side h2 {

                font-size: 29px;
            }
        }


        /* =========================================
           SMALL MOBILE
        ========================================= */

        @media (max-width: 480px) {

            .image-side {

                min-height: 235px;

                padding: 28px 22px;
            }


            .image-content h1 {

                font-size: 30px;
            }


            .image-content p {

                display: none;
            }


            .form-side {

                padding: 30px 20px 40px;
            }


            .row {

                grid-template-columns: 1fr;

                gap: 0;
            }


            .roles {

                gap: 8px;
            }


            .role-btn {

                font-size: 13px;
            }
        }

    </style>

</style>
</head>


<body>


    <div class="container">


        <!-- =========================================
             IMAGE
        ========================================= -->

        <div class="image-side">

            <div class="image-content">


                <div class="logo">

                    <i class="fa-solid fa-dumbbell"></i>

                    <span class="white">MOMENT</span>
                    <span class="green">UM</span>

                </div>


                <h1>
                    START YOUR<br>
                    <span>JOURNEY.</span>
                </h1>


                <p>
                    Create your account and take the first
                    step toward a stronger and healthier you.
                </p>


            </div>

        </div>


        <!-- =========================================
             FORM
        ========================================= -->

        <div class="form-side">


            <h2>
                Create Account
            </h2>


            <p class="subtitle">
                Join MoMentum and start your fitness journey.
            </p>


            <!-- ROLE -->

            <div class="role-title">
                I am a
            </div>


            <div class="roles">


                <button
                    type="button"
                    class="role-btn active"
                    id="athleteBtn"
                    onclick="setRole('athlete')">

                    <i class="fa-solid fa-person-running"></i>

                    Athlete

                </button>


                <button
                    type="button"
                    class="role-btn"
                    id="trainerBtn"
                    onclick="setRole('trainer')">

                    <i class="fa-solid fa-user-tie"></i>

                    Trainer

                </button>


            </div>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- NAME -->

                <div class="input-group">

                    <label>
                        Full Name
                    </label>


                    <div class="input-box">

                        <i class="fa-solid fa-user left-icon"></i>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required>

                    </div>

                </div>


                <!-- AGE + PHONE -->

                <div class="row">


                    <div class="input-group">

                        <label>
                            Age
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-calendar left-icon"></i>

                            <input
                                type="number"
                                id="age"
                                placeholder="Age"
                                min="10"
                                max="100"
                                required>

                        </div>

                    </div>


                    <div class="input-group">

                        <label>
                            Phone
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-phone left-icon"></i>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="Phone"
                                required>

                        </div>

                    </div>


                </div>


                <!-- WEIGHT + HEIGHT -->

                <div class="row">


                    <div class="input-group">

                        <label>
                            Weight (kg)
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-weight-scale left-icon"></i>

                            <input
                                type="number"
                                id="weight"
                                placeholder="Weight"
                                min="1"
                                required>

                        </div>

                    </div>


                    <div class="input-group">

                        <label>
                            Height (cm)
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-ruler-vertical left-icon"></i>

                            <input
                                type="number"
                                id="height"
                                placeholder="Height"
                                min="1"
                                required>

                        </div>

                    </div>


                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label>
                        Email
                    </label>


                    <div class="input-box">

                        <i class="fa-solid fa-envelope left-icon"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>

                </div>


                <!-- PASSWORD + CONFIRM -->

                <div class="row">


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label>
                            Password
                        </label>


                        <div class="input-box password-box">

                            <i class="fa-solid fa-lock left-icon"></i>


                            <input
                                type="password"
                                id="password"
                                placeholder="Password"
                                minlength="8"
                                autocomplete="new-password"
                                required>


                            <i
                                class="fa-solid fa-eye eye"
                                onclick="togglePassword('password', this)">
                            </i>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="input-group">

                        <label>
                            Confirm Password
                        </label>


                        <div class="input-box password-box">

                            <i class="fa-solid fa-lock left-icon"></i>


                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm"
                                minlength="8"
                                autocomplete="new-password"
                                required>


                            <i
                                class="fa-solid fa-eye eye"
                                onclick="togglePassword('confirmPassword', this)">
                            </i>

                        </div>

                    </div>


                </div>


                <!-- CREATE -->

                <button
                    class="create-btn"
                    type="submit">

                    CREATE ACCOUNT

                </button>


                <div
                    class="message"
                    id="message">
                </div>


            </form>


            <!-- SIGN IN -->

            <div class="signin">

                Already have an account?

                <a
                    id="signinLink"
                    href="test.html?role=athlete">

                    Sign In

                </a>

            </div>


        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>


        /* =========================================
           ROLE
        ========================================= */

        let selectedRole = "athlete";


        function setRole(role) {

            selectedRole = role;


            document
                .getElementById("athleteBtn")
                .classList.toggle(
                    "active",
                    role === "athlete"
                );


            document
                .getElementById("trainerBtn")
                .classList.toggle(
                    "active",
                    role === "trainer"
                );


            document.getElementById("signinLink").href =
                "test.html?role=" + role;
        }


        /* =========================================
           ROLE FROM URL
        ========================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const urlRole =
            params.get("role");


        if (
            urlRole === "trainer" ||
            urlRole === "athlete"
        ) {

            setRole(urlRole);

        }


        /* =========================================
           PASSWORD SHOW / HIDE
        ========================================= */

        function togglePassword(id, icon) {

            const input =
                document.getElementById(id);


            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove("fa-eye");

                icon.classList.add("fa-eye-slash");

            } else {

                input.type = "password";

                icon.classList.remove("fa-eye-slash");

                icon.classList.add("fa-eye");

            }

        }



// Fill these two PUBLIC project settings in BOTH pages before uploading.
const SUPABASE_URL = "https://xcgbxurbnsytecrdupct.supabase.co";
const SUPABASE_PUBLIC_KEY = "sb_publishable_PAd7gf0Q-N9H4PqgqqaVNg_EfE583xO";
let client;
function getClient() {
  if (!SUPABASE_URL.startsWith('https://') || SUPABASE_PUBLIC_KEY.startsWith('YOUR_'))
    throw new Error('Supabase is not configured. Add your Project URL and public key to this file.');
  if (!window.supabase) throw new Error('Could not load Supabase. Check your connection and reload.');
  return client || (client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY));
}
function showMessage(text, ok=false) {
  const el=document.getElementById('message');
  el.style.color=ok ? '#39d98a' : '#ff6b6b';
  el.textContent=text;
}
function clearLegacyPasswords() {
  localStorage.removeItem('userPassword');
  try {
    const users=JSON.parse(localStorage.getItem('users') || '[]');
    if (Array.isArray(users)) {
      users.forEach(u=>{delete u.userPassword; delete u.password;});
      localStorage.setItem('users', JSON.stringify(users));
    }
  } catch (_) { localStorage.removeItem('users'); }
}
function cacheProfile(user, profile) {
  // Compatibility cache only; authorization must use Supabase sessions and RLS.
  const values={userID:user.id, userName:profile.full_name, userRole:profile.role,
    userEmail:user.email, userPhone:profile.whatsapp, userAge:profile.age,
    userWeight:profile.weight, userHeight:profile.height, isLoggedIn:'true'};
  Object.entries(values).forEach(([k,v])=>localStorage.setItem(k,v ?? ''));
}
clearLegacyPasswords();

document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const button=this.querySelector('[type="submit"]');
  if(button.disabled) return;
  const value=id=>document.getElementById(id).value.trim();
  const password=document.getElementById('password').value;
  if(password.length<8) return showMessage('Password must be at least 8 characters.');
  if(password!==document.getElementById('confirmPassword').value)
    return showMessage('Passwords do not match.');
  const age=Number(value('age')),weight=Number(value('weight')),height=Number(value('height'));
  if(!Number.isInteger(age)||age<=0||!Number.isFinite(weight)||weight<=0||!Number.isFinite(height)||height<=0)
    return showMessage('Please enter valid age, weight, and height.');
  button.disabled=true; showMessage('Creating account...',true);
  try {
    const sb=getClient();
    const {data,error}=await sb.auth.signUp({email:value('email').toLowerCase(),password,
      options:{data:{full_name:value('name'),role:selectedRole,age,weight,height,whatsapp:value('phone')}}});
    if(error) throw error;
    if(!data.user) throw new Error('No account was returned. Please try again.');
    // Supabase can hide duplicate registrations; never display a synthetic ID as a new account.
    if(Array.isArray(data.user.identities) && data.user.identities.length===0)
      return showMessage('If this email is already registered, sign in or recover your password.');
    if(!data.session) {
      showMessage('Check your email to confirm registration, then return here to sign in.',true);
      return;
    }
    // Verify the trigger-created profile before reporting a fully usable account.
    const profile=await sb.from('profiles').select('id').eq('id',data.user.id).single();
    await sb.auth.signOut();
    localStorage.setItem('isLoggedIn','false');
    if(profile.error || !profile.data)
      throw new Error('Auth account created, but profile verification failed. Do not register again; check the trigger and SELECT policy. '+(profile.error?.message || ''));
    showMessage('Account created! Your ID: '+data.user.id+'. Redirecting to sign in...',true);
    setTimeout(()=>{window.location.href='test.html?role='+selectedRole;},1800);
  } catch(error) { showMessage(error.message || 'Registration failed. Please try again.'); }
  finally { button.disabled=false; }
});
</script>

</body>

</html>
